<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="800" fill="#ffffff" />
  <style>
    .table { fill: #ffffff; stroke: #2b6cb0; stroke-width: 2; }
    .table-title { font: bold 18px Arial, sans-serif; fill: #1a202c; }
    .field { font: 14px Arial, sans-serif; fill: #2d3748; }
    .line { stroke: #2b6cb0; stroke-width: 2; }
    .fk { stroke-dasharray: 6 4; }
    .note { font: 12px Arial, sans-serif; fill: #4a5568; }
  </style>

  <g transform="translate(50, 40)">
    <rect class="table" x="0" y="0" width="260" height="220" rx="12" ry="12" />
    <text class="table-title" x="16" y="32">ra_t_users</text>
    <text class="field" x="16" y="62">• id</text>
    <text class="field" x="16" y="84">• email</text>
    <text class="field" x="16" y="106">• password</text>
    <text class="field" x="16" y="128">• role</text>
    <text class="field" x="16" y="150">• actif</text>
    <text class="field" x="16" y="172">• last_login_at</text>
    <text class="field" x="16" y="194">• last_login_ip</text>
  </g>

  <g transform="translate(450, 40)">
    <rect class="table" x="0" y="0" width="260" height="180" rx="12" ry="12" />
    <text class="table-title" x="16" y="32">ra_t_api_tokens</text>
    <text class="field" x="16" y="62">• id</text>
    <text class="field" x="16" y="84">• user_id</text>
    <text class="field" x="16" y="106">• token_hash</text>
    <text class="field" x="16" y="128">• expires_at</text>
    <text class="field" x="16" y="150">• created_at</text>
  </g>

  <g transform="translate(850, 40)">
    <rect class="table" x="0" y="0" width="260" height="180" rx="12" ry="12" />
    <text class="table-title" x="16" y="32">ra_t_api_request_metrics</text>
    <text class="field" x="16" y="62">• id</text>
    <text class="field" x="16" y="84">• path</text>
    <text class="field" x="16" y="106">• method</text>
    <text class="field" x="16" y="128">• status_code</text>
    <text class="field" x="16" y="150">• duration_ms</text>
  </g>

  <g transform="translate(50, 320)">
    <rect class="table" x="0" y="0" width="260" height="200" rx="12" ry="12" />
    <text class="table-title" x="16" y="32">ra_t_audit_logs</text>
    <text class="field" x="16" y="62">• id</text>
    <text class="field" x="16" y="84">• user_id</text>
    <text class="field" x="16" y="106">• action</text>
    <text class="field" x="16" y="128">• entite</text>
    <text class="field" x="16" y="150">• description</text>
    <text class="field" x="16" y="172">• ip_address</text>
  </g>

  <g transform="translate(450, 320)">
    <rect class="table" x="0" y="0" width="260" height="180" rx="12" ry="12" />
    <text class="table-title" x="16" y="32">ra_t_notifications</text>
    <text class="field" x="16" y="62">• id</text>
    <text class="field" x="16" y="84">• user_id</text>
    <text class="field" x="16" y="106">• type</text>
    <text class="field" x="16" y="128">• message</text>
    <text class="field" x="16" y="150">• created_at</text>
  </g>

  <g transform="translate(850, 320)">
    <rect class="table" x="0" y="0" width="260" height="180" rx="12" ry="12" />
    <text class="table-title" x="16" y="32">ra_t_login_logs</text>
    <text class="field" x="16" y="62">• id</text>
    <text class="field" x="16" y="84">• user_id</text>
    <text class="field" x="16" y="106">• email</text>
    <text class="field" x="16" y="128">• ip_address</text>
    <text class="field" x="16" y="16">• status</text>
  </g>

  <line class="line" x1="260" y1="120" x2="450" y2="120" marker-end="url(#arrow)" />
  <line class="line" x1="260" y1="300" x2="450" y2="300" marker-end="url(#arrow)" />
  <line class="line" x1="710" y1="120" x2="850" y2="120" marker-end="url(#arrow)" />
  <line class="line fk" x1="200" y1="420" x2="200" y2="320" marker-end="url(#arrow)" />
  <line class="line fk" x1="510" y1="420" x2="510" y2="320" marker-end="url(#arrow)" />

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2b6cb0" />
    </marker>
  </defs>

  <text class="note" x="50" y="560">Schéma de la base de données SMSPLUS, fond blanc et éléments vectoriels pour une utilisation SVG claire.</text>
</svg>