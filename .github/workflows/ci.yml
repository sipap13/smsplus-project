name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: smsplus-api (lint + test)
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: smsplus
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smsplus
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval=10s --health-timeout=5s --health-retries=5
    defaults:
      run:
        working-directory: smsplus-api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_pgsql, pdo_sqlite, sqlite3
          coverage: none
      - name: Install composer deps
        run: composer install --no-interaction --prefer-dist
      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Wait for Postgres
        run: |
          echo 'Waiting for Postgres on 127.0.0.1:5432...'
          for i in $(seq 1 30); do
            if timeout 1 bash -c "</dev/tcp/127.0.0.1/5432" >/dev/null 2>&1; then
              echo 'Postgres is reachable'; exit 0
            fi
            sleep 1
          done
          echo 'Postgres did not become available' && exit 1
      - name: Run migrations (pgsql)
        run: php artisan migrate --force
      - name: Run tests
        run: php artisan test

  front:
    name: smsplus-front (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smsplus-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: smsplus-front/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

