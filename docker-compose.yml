services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: smsplus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - smsplus_pgdata:/var/lib/postgresql/data

  api:
    volumes:
      - ./smsplus-api/storage/imports:/app/storage/imports
      - ./smsplus-api/storage/framework/cache:/app/storage/framework/cache
      - ./smsplus-api/storage/framework/views:/app/storage/framework/views
      - ./smsplus-api/storage/framework/sessions:/app/storage/framework/sessions
      - ./smsplus-api/storage/framework/testing:/app/storage/framework/testing
      - ./smsplus-api/storage/logs:/app/storage/logs
      - ./smsplus-api/storage/app:/app/storage/app
      - ./smsplus-api/routes:/app/routes
      - ./smsplus-api/app/Http/Controllers:/app/app/Http/Controllers
      - ./smsplus-api/app/Http/Middleware:/app/app/Http/Middleware
      - ./smsplus-api/app/Exports:/app/app/Exports
      - ./smsplus-api/app/Services:/app/app/Services
      - ./smsplus-api/app/Mail:/app/app/Mail
      - ./smsplus-api/app/Models:/app/app/Models
      - ./smsplus-api/app/Jobs:/app/app/Jobs
      - ./smsplus-api/resources/views:/app/resources/views
      - ./smsplus-api/database/migrations:/app/database/migrations
    build:
      context: ./smsplus-api
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - "8001:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:aySyHJL24LfllZHsrJoy9urDATK9x36ecbI0cnV+NF8=
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: smsplus
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      GROQ_API_KEY: ${GROQ_API_KEY:-your_groq_api_key_here}
      GROQ_API_URL: https://api.groq.com/openai/v1/chat/completions
      GROQ_MODEL: llama-3.1-8b-instant
      # === Configuration Email (2FA) ===
      # Option 1: LOG (développement — les emails sont écrits dans storage/logs/laravel.log)
      #MAIL_MAILER: log
      # Option 2: SMTP Gmail — voir EMAIL_SETUP.md pour configurer
      #   1. Activez la 2FA sur votre compte Google
      #   2. Générez un App Password : https://myaccount.google.com/apppasswords
      #   3. Décommentez les lignes ci-dessous et remplacez VOTRE_APP_PASSWORD
      MAIL_MAILER: smtp
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USERNAME: bouaoun.melek@gmail.com
      MAIL_PASSWORD: rmhg bugq rjxa vtds
      MAIL_ENCRYPTION: tls
      MAIL_FROM_ADDRESS: noreply@tt.tn
      MAIL_FROM_NAME: "SMS+ VAS Tunisie Telecom"
    depends_on:
      - db
    command: >
      sh -lc "php -v
      && php artisan migrate --force
      && php artisan serve --host=0.0.0.0 --port=8000"

  front:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./smsplus-front:/app
      - smsplus_front_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: /api
      API_TARGET: http://api:8000
    command: >
      sh -lc "npm ci || npm install
      && npm run dev -- --host 0.0.0.0 --port 5173"

  queue:
    image: smsplus-project-api
    working_dir: /app
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:aySyHJL24LfllZHsrJoy9urDATK9x36ecbI0cnV+NF8=
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: smsplus
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    volumes:
      - ./smsplus-api/storage/imports:/app/storage/imports
      - ./smsplus-api/storage/framework/cache:/app/storage/framework/cache
      - ./smsplus-api/storage/framework/views:/app/storage/framework/views
      - ./smsplus-api/storage/framework/sessions:/app/storage/framework/sessions
      - ./smsplus-api/storage/framework/testing:/app/storage/framework/testing
      - ./smsplus-api/storage/logs:/app/storage/logs
      - ./smsplus-api/storage/app:/app/storage/app
      - ./smsplus-api/routes:/app/routes
      - ./smsplus-api/app:/app/app
      - ./smsplus-api/database:/app/database
    depends_on:
      - db
    command: >
      sh -lc "php artisan queue:work --sleep=3 --tries=3"

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - db

volumes:
  smsplus_pgdata:
  smsplus_front_node_modules:
